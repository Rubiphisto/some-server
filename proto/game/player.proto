syntax = "proto3";

package client.game.v1;

import "common.proto";

message PlayerMessageRequest {
  client.common.v1.RequestHeader header = 1;
  bytes payload = 2;
}

message PlayerMessageResponse {
  client.common.v1.ResponseHeader header = 1;
  bytes payload = 2;
}

message PlayerPushMessage {
  uint32 message_id = 1;
  bytes payload = 2;
}

message PlayerEchoRequest {
  string text = 1;
}

message PlayerEchoResponse {
  uint64 player_id = 1;
  string text = 2;
  string display_name = 3;
  uint64 login_count = 4;
}

message RenamePlayerRequest {
  string display_name = 1;
}

message RenamePlayerResponse {
  uint64 player_id = 1;
  string display_name = 2;
}

message PlayerProfilePush {
  uint64 player_id = 1;
  string display_name = 2;
  uint32 level = 3;
  uint64 login_count = 4;
}
