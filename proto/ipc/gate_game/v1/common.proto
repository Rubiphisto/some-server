syntax = "proto3";

package some_server.ipc.gate_game.v1;

enum ResultCode {
  RESULT_CODE_UNSPECIFIED = 0;
  RESULT_CODE_OK = 1;
  RESULT_CODE_INVALID_ARGUMENT = 2;
  RESULT_CODE_UNAUTHORIZED = 3;
  RESULT_CODE_PLAYER_NOT_FOUND = 4;
  RESULT_CODE_PLAYER_HELD_BY_OTHER_GAME = 5;
  RESULT_CODE_SESSION_EXPIRED = 6;
